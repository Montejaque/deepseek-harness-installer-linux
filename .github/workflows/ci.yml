name: CI and AppImage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python syntax
        run: python3 -m py_compile installer.py docs/generate_guide.py
      - name: Validate build script
        run: bash -n build.sh

  build-appimage:
    needs: validate
    runs-on: ubuntu-22.04
    # Build against Ubuntu 20.04 / glibc 2.31, the oldest supported target.
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y python3 python3-pip python3-tk tcl8.6 tk8.6 xvfb xauth xdotool wget ca-certificates file
          python3 -m pip install --user --no-cache-dir 'PyInstaller==5.13.2' 'reportlab<4.4'
          python3 - <<'PY'
          import json
          from unittest.mock import patch
          import installer
          assert installer.version_tuple("v22.19.0") == (22, 19, 0)
          class Response:
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self):
                  return json.dumps({"dist-tags": {"latest": "1.2.3"}}).encode()
          with patch("installer.urllib.request.urlopen", return_value=Response()):
              assert installer.latest_npm_version() == "1.2.3"
          class NextResponse(Response):
              def read(self):
                  return json.dumps({"dist-tags": {"latest": "0.2.1", "next": "0.2.2-rc.3"}}).encode()
          with patch("installer.urllib.request.urlopen", return_value=NextResponse()):
              assert installer.latest_npm_version() == "0.2.2-rc.3"
          with patch("installer.runtime_paths", return_value=(None, None, None)):
              ok, status = installer.runtime_status()
              assert ok and "automáticamente" in status
          print("NPM_REGISTRY_AND_AUTOMATIC_NODE_SETUP_TESTS_OK")
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          mv "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Build AppImage on Ubuntu 20.04 (glibc 2.31)
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
      - name: Verify the actual installer window opens
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bash -c '
            set -euo pipefail
            log="$RUNNER_TEMP/deepseek-gui.log"
            ./dist/DeepSeek-Harness-Installer-x86_64.AppImage >"$log" 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 20); do
              if xdotool search --onlyvisible --name "DeepSeek Harness" >/dev/null 2>&1; then
                echo "ACTUAL_INSTALLER_WINDOW_VISIBLE_OK"
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat "$log"
                echo "El instalador se cerró antes de mostrar su ventana." >&2
                exit 1
              fi
              sleep 1
            done
            cat "$log"
            echo "No apareció la ventana real del instalador en 20 segundos." >&2
            exit 1
          '
      - name: Verify artifact, architecture and checksum
        run: |
          set -euxo pipefail
          test -s dist/DeepSeek-Harness-Installer-x86_64.AppImage
          file dist/DeepSeek-Harness-Installer-x86_64.AppImage
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer-x86_64
          path: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish test release
    needs: build-appimage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Download verified AppImage
        uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Installer-x86_64
          path: dist
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DeepSeek Harness Installer v0.1.${{ github.run_number }}
          body: |
            Versión preliminar del instalador AppImage para Linux x86_64. Cada ejecución genera un tag independiente; no reutiliza versiones anteriores.

            - Construida sobre Ubuntu 20.04 (glibc 2.31).\n            - Prueba automatizada confirma que la ventana real del instalador aparece.
            - Interfaz gráfica alineada con los gestores de Punto Vuela Montejaque.
            - Consulta la última versión directamente en el registro npm, sin depender de que NVM esté cargado en el escritorio.
            - Guía PDF integrada, barra de progreso y reparación del icono y menú GNOME.
            - Se comprueba que la ventana real del instalador aparece en CI.
            - Instalación por usuario, sin permisos root.
            - Descarga automáticamente Node.js 24 LTS y npm en el perfil del usuario; no requiere Node.js ni NVM preinstalados.
            - Necesita conexión a Internet para preparar el runtime e instalar `@deepseek-ai/dsh`.
            - Versión preliminar para pruebas; no es una versión estable.
          prerelease: true
          files: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          fail_on_unmatched_files: true
