name: CI and AppImage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python syntax
        run: python3 -m py_compile installer.py
      - name: Validate build script
        run: bash -n build.sh

  build-appimage:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk tcl8.6 tk8.6 xvfb xauth wget ca-certificates file
          python3 -m pip install --user --no-cache-dir 'PyInstaller==5.13.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo mv "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Build AppImage on Ubuntu 22.04
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
      - name: Test real graphical startup (Tkinter)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-window.py" <<'PY'
          import tkinter as tk
          import time
          root = tk.Tk()
          root.title("DeepSeek Harness Installer CI")
          root.geometry("300x120")
          root.update_idletasks()
          root.update()
          assert root.winfo_exists() == 1
          assert root.winfo_viewable() == 1
          print("TK_WINDOW_VISIBLE_OK", flush=True)
          root.destroy()
          PY
          xvfb-run -a python3 "$RUNNER_TEMP/check-window.py"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout --signal=TERM --kill-after=3s 10s xvfb-run -a ./dist/DeepSeek-Harness-Installer-x86_64.AppImage > gui-smoke.log 2>&1
          status=$?
          set -e
          cat gui-smoke.log
          if [ "$status" -ne 124 ] && [ "$status" -ne 137" ]; then
            echo "El instalador terminó inesperadamente (código $status)." >&2
            exit 1
          fi
          if grep -Eiq "TclError|no display name|couldn't connect to display|can't find package|init\.tcl|Traceback|ModuleNotFoundError" gui-smoke.log; then
            echo "La interfaz gráfica ha mostrado errores de inicio." >&2
            exit 1
          fi
          echo "La aplicación permaneció ejecutándose durante la prueba gráfica."
      - name: Verify artifact and architecture
        run: |
          set -euxo pipefail
          test -s dist/DeepSeek-Harness-Installer-x86_64.AppImage
          file dist/DeepSeek-Harness-Installer-x86_64.AppImage
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer-x86_64
          path: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish test release
    needs: build-appimage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Download verified AppImage
        uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Installer-x86_64
          path: dist
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ github.sha }}
          name: DeepSeek Harness Installer v0.1.1
          body: |
            Primera versión de pruebas del instalador AppImage para Linux x86_64.

            - Instalación por usuario, sin permisos root.
            - Requiere Node.js compatible y conexión a Internet para instalar `@deepseek-ai/dsh`.
            - Compilación y checksum verificados por GitHub Actions.
            - Versión preliminar para pruebas; no es una versión estable.
          prerelease: true
          files: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          fail_on_unmatched_files: true
