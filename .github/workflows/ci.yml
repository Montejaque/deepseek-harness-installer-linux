name: CI and AppImage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python syntax
        run: python3 -m py_compile installer.py
      - name: Validate build script
        run: bash -n build.sh

  build-appimage:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk wget ca-certificates file
          python3 -m pip install --user --no-cache-dir 'PyInstaller==5.13.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo mv "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Build AppImage on Ubuntu 22.04
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
      - name: Verify artifact and architecture
        run: |
          set -euxo pipefail
          test -s dist/DeepSeek-Harness-Installer-x86_64.AppImage
          file dist/DeepSeek-Harness-Installer-x86_64.AppImage
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer-x86_64
          path: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek-Harness-Installer-x86_64.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
